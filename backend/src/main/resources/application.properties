# ── Server ─────────────────────────────────────────────────────────────────────
# Railway injects PORT automatically
server.port=${PORT:8080}

# ── Database (PostgreSQL on Railway) ───────────────────────────────────────────
# Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
# when you add a PostgreSQL plugin to your project.
# DATABASE_URL from Railway uses postgresql:// which Spring Boot can't use directly,
# so we build the JDBC URL from the individual variables instead.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ── CORS ───────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
